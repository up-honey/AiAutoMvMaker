spring:
  application:
    name: fire-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fire}
    username: ${DB_USERNAME:fire}
    password: ${DB_PASSWORD:fire-local}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

fire:
  video:
    default-provider: ${FIRE_VIDEO_DEFAULT_PROVIDER:mock}
