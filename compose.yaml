services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fire}
      POSTGRES_USER: ${DB_USERNAME:-fire}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fire-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fire} -d ${DB_NAME:-fire}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      FIRE_VIDEO_DEFAULT_PROVIDER: ${VIDEO_PROVIDER:-mock}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-fire}
      DB_USERNAME: ${DB_USERNAME:-fire}
      DB_PASSWORD: ${DB_PASSWORD:-fire-local}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
